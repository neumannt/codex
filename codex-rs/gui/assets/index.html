<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #f2f2ef; --border: #deddd8; --text: #1f1f1c; --muted: #6d6c66;
  --accent: #2f6fdf; --accent-text: #fff; --ok: #2e8540; --warn: #a86400; --bad: #c0392b;
  --code-bg: #efeee9; --user-bg: #e7eefc; --add: #e3f4e5; --del: #fbe6e4;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1a; --panel: #232322; --border: #393936; --text: #e6e5e0; --muted: #9c9b94;
    --accent: #5b8ff0; --accent-text: #fff; --ok: #5cbf6f; --warn: #e0a040; --bad: #ef6b5d;
    --code-bg: #2a2a28; --user-bg: #26324a; --add: #1f3a25; --del: #44231f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); }
select, input[type=text], textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
code, pre { font-family: var(--mono); font-size: 12.5px; }

#app { display: grid; grid-template-columns: 290px 1fr; height: 100%; }
#sidebar { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#folder { padding: 12px; border-bottom: 1px solid var(--border); }
#folder .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#folder .path { font-family: var(--mono); font-size: 12px; word-break: break-all; margin: 4px 0 8px; }
#folder .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#sessions-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 4px; }
#sessions-head .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#sessions { overflow-y: auto; flex: 1; padding: 0 6px 12px; }
.session { padding: 6px 8px; border-radius: 6px; cursor: pointer; margin: 1px 0; }
.session:hover { background: var(--bg); }
.session.active { background: var(--bg); outline: 1px solid var(--border); }
.session .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session .meta { font-size: 11.5px; color: var(--muted); }
.empty { color: var(--muted); padding: 8px; font-size: 13px; }

#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#topbar .title { font-weight: 600; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
#banner { display: none; padding: 8px 14px; background: var(--del); color: var(--text); border-bottom: 1px solid var(--border); }
#transcript { flex: 1; overflow-y: auto; padding: 16px 0 24px; }
#transcript > .inner { max-width: 880px; margin: 0 auto; padding: 0 20px; }
.hint { color: var(--muted); text-align: center; margin-top: 18vh; }
.item { margin: 10px 0; }
.user { background: var(--user-bg); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; margin-left: 12%; }
.agent p { margin: .4em 0; }
.agent pre, .diff, .output { background: var(--code-bg); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: .5em 0; }
.agent code { background: var(--code-bg); border-radius: 4px; padding: 0 3px; }
.agent pre code { background: none; padding: 0; }
.agent h1, .agent h2, .agent h3, .agent h4 { margin: .8em 0 .3em; line-height: 1.25; }
.agent h1 { font-size: 1.3em; } .agent h2 { font-size: 1.18em; } .agent h3, .agent h4 { font-size: 1.05em; }
.agent ul, .agent ol { margin: .3em 0; padding-left: 1.6em; }
.agent blockquote { margin: .4em 0; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
.agent table { border-collapse: collapse; margin: .5em 0; display: block; overflow-x: auto; }
.agent th, .agent td { border: 1px solid var(--border); padding: 3px 8px; }
.agent a { color: var(--accent); }
details.tool { border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
details.tool > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
details.tool > summary::-webkit-details-marker { display: none; }
details.tool > summary .what { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
details.tool > summary .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); align-self: center; }
.dot.run { background: var(--accent); animation: pulse 1s infinite alternate; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.off { background: var(--border); }
@keyframes pulse { from { opacity: 1; } to { opacity: .3; } }
.output { max-height: 360px; overflow: auto; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.diff { font-family: var(--mono); font-size: 12px; white-space: pre; }
.diff .a { background: var(--add); display: block; } .diff .d { background: var(--del); display: block; } .diff .h { color: var(--muted); display: block; }
.reasoning { color: var(--muted); font-size: 13px; }
.reasoning > summary { cursor: pointer; }
.reasoning .body { white-space: pre-wrap; padding: 4px 0 0 14px; }
.plan { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.plan .step.completed { color: var(--muted); text-decoration: line-through; }
.plan .step.inProgress { font-weight: 600; }
.notice { font-size: 13px; color: var(--muted); }
.notice.error { color: var(--bad); white-space: pre-wrap; }
.notice.warn { color: var(--warn); }

#composer { border-top: 1px solid var(--border); padding: 10px 14px 12px; }
#composer .inner { max-width: 880px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; resize: none; min-height: 42px; max-height: 40vh; padding: 9px 10px; }
#composer .status { max-width: 880px; margin: 4px auto 0; font-size: 12px; color: var(--muted); min-height: 1.2em; }

#composer .inner { position: relative; }
#slash { position: absolute; left: 0; bottom: calc(100% + 6px); width: min(520px, 100%); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-height: 320px; overflow-y: auto; z-index: 5; padding: 4px; }
#slash .cmd { display: flex; gap: 12px; padding: 5px 8px; border-radius: 5px; cursor: pointer; align-items: baseline; }
#slash .cmd.sel { background: var(--panel); }
#slash .name { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
#slash .desc { color: var(--muted); font-size: 13px; }
table.kv { border-collapse: collapse; width: 100%; }
table.kv td { padding: 4px 12px 4px 0; vertical-align: top; border-bottom: 1px solid var(--border); }
table.kv td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
table.kv code { word-break: break-all; }
.modal.wide { width: min(980px, 100%); }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.modal { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; width: min(680px, 100%); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal h2 { font-size: 16px; margin: 0; padding: 14px 16px 6px; }
.modal .body { padding: 4px 16px 10px; overflow-y: auto; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px 14px; flex-wrap: wrap; border-top: 1px solid var(--border); }
.modal .muted { color: var(--muted); font-size: 13px; }
.modal pre.cmd { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
.dirlist { border: 1px solid var(--border); border-radius: 6px; height: 320px; overflow-y: auto; margin-top: 8px; }
.dirlist div { padding: 3px 10px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
.dirlist div:hover { background: var(--panel); }
.choice { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 12px; }
.choice .sub { display: block; font-size: 12.5px; color: var(--muted); }
@media (max-width: 720px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  #sidebar { max-height: 38vh; border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="folder">
      <div class="label">Folder</div>
      <div class="path" id="folder-path">…</div>
      <div class="row">
        <button id="change-folder">Change…</button>
        <span id="trust-badge" class="badge">…</span>
      </div>
    </div>
    <div id="sessions-head">
      <span class="label">Sessions in this folder</span>
      <button id="new-session" title="Start a new session">New</button>
    </div>
    <div id="sessions"></div>
  </aside>
  <main id="main">
    <div id="topbar">
      <span class="title" id="session-title">New session</span>
      <span class="badge" id="sandbox-badge" title="Sandbox and approval policy of the current session">sandbox: from config</span>
      <select id="model" title="Model for the next turn"></select>
    </div>
    <div id="banner"></div>
    <div id="transcript"><div class="inner" id="items"></div></div>
    <div id="composer">
      <div class="inner">
        <div id="slash" hidden></div>
        <textarea id="input" rows="1" placeholder="Ask Codex to do something…  (Enter sends, Shift+Enter for a new line, / for commands)"></textarea>
        <button id="send" class="primary">Send</button>
        <button id="stop" class="danger" hidden>Stop</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </main>
</div>
<script>
"use strict";

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get("token") || "";
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function api(path, params, method) {
  const q = new URLSearchParams({ token: TOKEN, ...(params || {}) });
  return fetch(`${path}?${q}`, { method: method || "GET" }).then(async (r) => {
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  });
}
function relTime(sec) {
  if (!sec) return "";
  const d = Date.now() / 1000 - sec;
  if (d < 60) return "just now";
  if (d < 3600) return `${Math.floor(d / 60)} min ago`;
  if (d < 86400) return `${Math.floor(d / 3600)} h ago`;
  if (d < 7 * 86400) return `${Math.floor(d / 86400)} d ago`;
  return new Date(sec * 1000).toLocaleDateString();
}
function joinPath(dir, name) { return dir.endsWith("/") ? dir + name : `${dir}/${name}`; }
function parentPath(dir) { const p = dir.replace(/\/+$/, "").replace(/\/[^/]*$/, ""); return p || "/"; }
function shortPath(p) { return S.home && (p === S.home || p.startsWith(S.home + "/")) ? "~" + p.slice(S.home.length) : p; }

// ---------- minimal, escaping markdown renderer ----------
function inlineMd(text) {
  const parts = text.split(/(`[^`\n]+`)/g);
  return parts.map((part) => {
    if (/^`[^`\n]+`$/.test(part)) return `<code>${esc(part.slice(1, -1))}</code>`;
    let s = esc(part);
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
    return s;
  }).join("");
}
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let html = "", i = 0, para = [];
  const flush = () => { if (para.length) { html += `<p>${inlineMd(para.join("\n")).replace(/\n/g, "<br>")}</p>`; para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*(```+|~~~+)\s*([\w+-]*)/);
    if (fence) {
      flush();
      const body = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) body.push(lines[i++]);
      i++;
      html += `<pre><code>${esc(body.join("\n"))}</code></pre>`;
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flush(); const n = Math.min(h[1].length, 4); html += `<h${n}>${inlineMd(h[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); html += "<hr>"; i++; continue; }
    if (/^\s*>/.test(line)) {
      flush(); const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ""));
      html += `<blockquote>${renderMarkdown(body.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      flush();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inlineMd(c.trim()));
      html += "<table><tr>" + cells(line).map((c) => `<th>${c}</th>`).join("") + "</tr>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) html += "<tr>" + cells(lines[i++]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      html += "</table>"; continue;
    }
    const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      flush();
      const ordered = /\d/.test(li[2]);
      html += ordered ? "<ol>" : "<ul>";
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m) { html += `<li>${inlineMd(m[3])}`; i++; }
        else if (/^\s{2,}\S/.test(lines[i])) { html += `<br>${inlineMd(lines[i].trim())}`; i++; continue; }
        else break;
        html += "</li>";
      }
      html += ordered ? "</ol>" : "</ul>";
      continue;
    }
    if (!line.trim()) { flush(); i++; continue; }
    para.push(line); i++;
  }
  flush();
  return html;
}
function renderDiff(diff) {
  const box = el("div", { class: "diff" });
  for (const line of String(diff || "").split("\n")) {
    const cls = line.startsWith("+") && !line.startsWith("+++") ? "a" : line.startsWith("-") && !line.startsWith("---") ? "d" : line.startsWith("@@") ? "h" : null;
    box.append(cls ? el("span", { class: cls }, line) : document.createTextNode(line + "\n"));
  }
  return box;
}

// ---------- JSON-RPC over the bridge websocket ----------
class Rpc {
  constructor(url) {
    this.nextId = 1; this.pending = new Map();
    this.onNotification = () => {}; this.onRequest = () => {}; this.onClose = () => {};
    this.ready = new Promise((resolve, reject) => {
      this.ws = new WebSocket(url);
      this.ws.onopen = resolve;
      this.ws.onerror = () => reject(new Error("cannot connect to the Codex GUI bridge"));
    });
    this.ws.onmessage = (ev) => this.dispatch(JSON.parse(ev.data));
    this.ws.onclose = () => {
      for (const { reject } of this.pending.values()) reject(new Error("disconnected"));
      this.pending.clear();
      this.onClose();
    };
  }
  dispatch(msg) {
    if (msg.id != null && ("result" in msg || "error" in msg) && !("method" in msg)) {
      const p = this.pending.get(msg.id);
      if (!p) return;
      this.pending.delete(msg.id);
      if (msg.error) p.reject(Object.assign(new Error(msg.error.message || "request failed"), { rpc: msg.error }));
      else p.resolve(msg.result);
    } else if (msg.id != null && msg.method) {
      this.onRequest(msg);
    } else if (msg.method) {
      this.onNotification(msg.method, msg.params || {});
    }
  }
  request(method, params) {
    const id = this.nextId++;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ id, method, params: params || {} }));
    });
  }
  notify(method, params) { this.ws.send(JSON.stringify(params === undefined ? { method } : { method, params })); }
  respond(id, result) { this.ws.send(JSON.stringify({ id, result })); }
  respondError(id, message) { this.ws.send(JSON.stringify({ id, error: { code: -32000, message } })); }
}

// ---------- state ----------
const S = {
  rpc: null, home: null,
  cwd: null, trust: null, lookOnly: false,
  threadId: null, thread: null, turnId: null, running: false,
  models: [], modelOverride: null,
  info: null,          // /api/info
  threadInfo: null,    // last thread/start|resume|fork response
  usage: null,         // last token usage of the current session
  costMicros: null,    // provider-reported cost of this window's app-server
  items: new Map(),    // itemId -> { item, node }
  plans: new Map(),    // turnId -> node
  approvals: [],       // pending server requests
  approvalOpen: null,
};

function setStatus(text) { $("status").textContent = text || ""; }
function showBanner(text) { const b = $("banner"); b.textContent = text; b.style.display = text ? "block" : "none"; }
function scrollToBottom(force) {
  const t = $("transcript");
  if (force || t.scrollHeight - t.scrollTop - t.clientHeight < 120) t.scrollTop = t.scrollHeight;
}
function setRunning(running) {
  S.running = running;
  $("stop").hidden = !running;
  $("send").textContent = running ? "Steer" : "Send";
  $("send").title = running ? "Add this message to the running turn" : "";
  setStatus(running ? "Working…  (Esc to stop)" : "");
}
function describeSandbox(sandbox, approval) {
  if (!sandbox) return ["sandbox: from config", ""];
  const net = sandbox.networkAccess === true || sandbox.networkAccess === "enabled" ? ", network" : "";
  const names = { workspaceWrite: "workspace-write", readOnly: "read-only", dangerFullAccess: "full access (no sandbox)", externalSandbox: "external sandbox" };
  const a = typeof approval === "string" ? approval : approval ? "granular" : "?";
  const cls = sandbox.type === "dangerFullAccess" ? "bad" : sandbox.type === "readOnly" ? "ok" : "";
  return [`sandbox: ${names[sandbox.type] || sandbox.type}${net} · approvals: ${a}`, cls];
}
function applyThreadInfo(r) {
  S.threadInfo = r;
  const [text, cls] = describeSandbox(r.sandbox, r.approvalPolicy);
  const b = $("sandbox-badge"); b.textContent = text; b.className = "badge " + cls;
  if (r.sandbox && r.sandbox.writableRoots && r.sandbox.writableRoots.length) b.title = "Writable: " + r.sandbox.writableRoots.join(", ");
  if (r.model) selectModel(r.model);
}
function resetSandboxBadge() { const b = $("sandbox-badge"); b.textContent = "sandbox: from config"; b.className = "badge"; b.title = ""; }

// ---------- models ----------
async function loadModels() {
  try {
    let cursor = null; const all = [];
    do {
      const r = await S.rpc.request("model/list", { cursor, limit: 200 });
      all.push(...r.data); cursor = r.nextCursor;
    } while (cursor);
    S.models = all.filter((m) => !m.hidden);
    const sel = $("model"); sel.textContent = "";
    sel.append(el("option", { value: "" }, "model from config"));
    for (const m of S.models) sel.append(el("option", { value: m.model, title: m.description || "" }, m.displayName || m.model));
  } catch (e) {
    $("model").append(el("option", { value: "" }, "model from config"));
  }
}
// Show the session's model without turning it into an override; only an explicit
// choice in the picker is sent with requests, so config.toml stays authoritative.
function selectModel(model) {
  if (S.modelOverride) return;
  const sel = $("model");
  if (![...sel.options].some((o) => o.value === model)) sel.append(el("option", { value: model }, model));
  sel.value = model;
}

// ---------- folders, trust, sessions ----------
function updateTrustBadge() {
  const b = $("trust-badge"), t = S.trust;
  if (!t) { b.textContent = "…"; b.className = "badge"; return; }
  if (S.lookOnly) { b.textContent = "restricted (this session only)"; b.className = "badge warn"; b.title = "Project instructions, skills, config and hooks are ignored."; }
  else if (t.trustLevel === "trusted") { b.textContent = "trusted"; b.className = "badge ok"; b.title = `Trust saved for ${t.trustTarget}`; }
  else if (t.trustLevel === "untrusted") { b.textContent = "untrusted"; b.className = "badge warn"; b.title = "Saved as untrusted: project config, hooks and exec policies stay disabled."; }
  else { b.textContent = "not trusted"; b.className = "badge"; b.title = ""; }
}

async function openFolder(path) {
  let trust;
  try { trust = await api("/api/trust", { cwd: path }); }
  catch (e) { alertModal("Cannot open folder", e.message); return false; }
  let lookOnly = false;
  if (trust.trustLevel == null) {
    const choice = await trustPrompt(trust);
    if (choice === "cancel") return false;
    if (choice === "trust") {
      try { trust = await api("/api/trust", { cwd: trust.cwd }, "POST"); }
      catch (e) { alertModal("Could not save trust", e.message); return false; }
    } else lookOnly = true;
  }
  if (S.running && !(await confirmModal("A turn is still running", "Switching folders leaves the running session. Its turn continues in the background until this window closes. Switch anyway?"))) return false;
  await leaveThread();
  S.cwd = trust.cwd; S.trust = trust; S.lookOnly = lookOnly;
  $("folder-path").textContent = shortPath(S.cwd);
  $("folder-path").title = S.cwd;
  document.title = `Codex – ${S.cwd.split("/").pop() || S.cwd}`;
  updateTrustBadge();
  newSession();
  await refreshSessions();
  return true;
}

async function refreshSessions() {
  const box = $("sessions");
  if (!S.cwd) return;
  let threads = [];
  try {
    const r = await S.rpc.request("thread/list", { cwd: S.cwd, sourceKinds: ["cli", "vscode"], sortKey: "updated_at", limit: 60 });
    threads = r.data;
  } catch (e) {
    box.textContent = ""; box.append(el("div", { class: "empty" }, "Could not list sessions: " + e.message)); return;
  }
  box.textContent = "";
  if (!threads.length) { box.append(el("div", { class: "empty" }, "No saved sessions here yet.")); return; }
  for (const t of threads) {
    const src = t.source === "cli" ? "TUI" : t.source === "vscode" ? "GUI / IDE" : "";
    const title = t.name || t.preview || "(no messages)";
    box.append(el("div", { class: "session" + (t.id === S.threadId ? " active" : ""), title: t.preview || "", onclick: () => resumeThread(t) },
      el("div", { class: "title" }, title.split("\n")[0]),
      el("div", { class: "meta" }, [relTime(t.updatedAt), src, t.model].filter(Boolean).join(" · "))));
  }
}

function clearTranscript() {
  S.items.clear(); S.plans.clear();
  $("items").textContent = "";
}
function newSession() {
  clearTranscript();
  S.threadId = null; S.thread = null; S.turnId = null; S.threadInfo = null; S.usage = null;
  setRunning(false);
  $("session-title").textContent = "New session";
  resetSandboxBadge();
  if (!S.modelOverride) $("model").value = "";
  $("items").append(el("div", { class: "hint" }, "Start a new session in ", el("code", {}, shortPath(S.cwd || "")), " by sending a message, or pick a saved session on the left."));
  for (const n of document.querySelectorAll(".session.active")) n.classList.remove("active");
  $("input").focus();
}

async function leaveThread() {
  const id = S.threadId;
  if (!id) return;
  S.threadId = null;
  // Unsubscribing unloads the thread once no client watches it, which releases its
  // session lock so the TUI can resume it.
  try { await S.rpc.request("thread/unsubscribe", { threadId: id }); } catch (e) { /* already gone */ }
}

function threadOverrides() { return S.lookOnly && S.trust ? { config: S.trust.lookOnlyConfig } : {}; }

async function ensureThread() {
  if (S.threadId) return S.threadId;
  const r = await S.rpc.request("thread/start", { cwd: S.cwd, model: S.modelOverride, ...threadOverrides() });
  clearTranscript();
  S.threadId = r.thread.id; S.thread = r.thread;
  applyThreadInfo(r);
  return S.threadId;
}

async function resumeThread(t) {
  if (t.id === S.threadId) return;
  if (S.running && !(await confirmModal("A turn is still running", "Switching sessions leaves the running turn. It continues in the background until this window closes. Switch anyway?"))) return;
  await leaveThread();
  clearTranscript();
  setRunning(false);
  $("session-title").textContent = (t.name || t.preview || "Session").split("\n")[0];
  setStatus("Loading session…");
  let r;
  try {
    r = await S.rpc.request("thread/resume", { threadId: t.id, ...threadOverrides() });
  } catch (e) {
    setStatus("");
    const busy = /active writer/i.test(e.message);
    notice(busy
      ? "This session is open in another Codex process (for example the TUI). Close it there, then try again."
      : "Could not resume this session: " + e.message, "error");
    return;
  }
  showThread(r);
  if (!S.running) setStatus("");
  refreshSessions();
  scrollToBottom(true);
}

// Renders a thread/resume or thread/fork response as the current session.
function showThread(r) {
  S.threadId = r.thread.id; S.thread = r.thread;
  applyThreadInfo(r);
  $("session-title").textContent = (r.thread.name || r.thread.preview || "Session").split("\n")[0];
  let count = 0;
  for (const turn of r.thread.turns || []) {
    for (const item of turn.items || []) { renderItem(item, turn.id); count++; }
    if (turn.status === "failed" && turn.error) notice(turn.error.message, "error");
    if (turn.status === "inProgress") { S.turnId = turn.id; setRunning(true); }
  }
  if (!count && r.itemsBackwardsCursor) {
    const threadId = S.threadId;
    S.rpc.request("thread/items/list", { threadId, cursor: r.itemsBackwardsCursor, sortDirection: "desc", limit: 500 })
      .then((page) => { if (S.threadId === threadId) { for (const entry of page.data.slice().reverse()) renderItem(entry.item, entry.turnId); scrollToBottom(true); } })
      .catch((e) => notice("Could not load the session history: " + e.message, "error"));
  }
  return count;
}

// ---------- sending ----------
async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  if (!S.cwd) return;
  input.value = ""; autosize(); hideSlash();
  if (/^\/[^/\s]/.test(text)) { await runSlash(text); return; }
  await sendText(text.startsWith("//") ? text.slice(1) : text);
}
async function sendText(text) {
  const input = $("input");
  const userInput = [{ type: "text", text, text_elements: [] }];
  try {
    if (S.running && S.turnId) {
      await S.rpc.request("turn/steer", { threadId: S.threadId, input: userInput, expectedTurnId: S.turnId });
      return;
    }
    await ensureThread();
    if ($("session-title").textContent === "New session") $("session-title").textContent = text.split("\n")[0].slice(0, 80);
    setRunning(true);
    const r = await S.rpc.request("turn/start", { threadId: S.threadId, input: userInput, model: S.modelOverride });
    if (r && r.turn) S.turnId = r.turn.id;
  } catch (e) {
    setRunning(false);
    notice("Request failed: " + e.message, "error");
    input.value = input.value || text; autosize();
  }
}
async function stop() {
  if (!S.threadId || !S.turnId) return;
  try { await S.rpc.request("turn/interrupt", { threadId: S.threadId, turnId: S.turnId }); }
  catch (e) { notice("Could not stop: " + e.message, "error"); }
}

// ---------- rendering thread items ----------
function notice(text, kind) {
  for (const h of document.querySelectorAll("#items > .hint")) h.remove();
  $("items").append(el("div", { class: `item notice ${kind || ""}` }, text));
  scrollToBottom();
}
function statusDot(status) {
  const cls = status === "inProgress" ? "run" : status === "completed" ? "ok" : status === "failed" ? "bad" : status === "declined" ? "off" : "";
  return el("span", { class: "dot " + cls, title: status || "" });
}
function fmtDuration(ms) { return ms == null ? "" : ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`; }

function renderItem(item, turnId) {
  if (!item || !item.id) return;
  for (const h of document.querySelectorAll("#items > .hint")) h.remove();
  let entry = S.items.get(item.id);
  const fresh = !entry;
  if (fresh) { entry = { item, node: el("div", { class: "item" }), open: false }; S.items.set(item.id, entry); $("items").append(entry.node); }
  else {
    const det = entry.node.querySelector("details");
    entry.open = det ? det.open : false;
    // Keep streamed text when the completed item omits it.
    entry.item = { ...entry.item, ...item };
  }
  drawItem(entry);
  scrollToBottom();
}

function drawItem(entry) {
  const item = entry.item, node = entry.node;
  node.textContent = "";
  switch (item.type) {
    case "userMessage": {
      const text = (item.content || []).map((c) => c.type === "text" ? c.text : c.type === "localImage" ? `[image ${c.path}]` : c.type === "image" ? "[image]" : c.name ? `@${c.name}` : "").join("\n");
      node.append(el("div", { class: "user" }, text));

    }
    case "agentMessage": {
      const div = el("div", { class: "agent" }); div.innerHTML = renderMarkdown(item.text || "");
      node.append(div); break;
    }
    case "plan": {
      const div = el("div", { class: "agent" }); div.innerHTML = renderMarkdown(item.text || "");
      node.append(div); break;
    }
    case "reasoning": {
      const text = [...(item.summary || [])].join("\n\n").trim();
      if (!text) break;
      const det = el("details", { class: "reasoning", open: entry.open },
        el("summary", {}, "Thinking: " + text.split("\n")[0].replace(/\*\*/g, "").slice(0, 90)),
        el("div", { class: "body" }, text));
      node.append(det); break;
    }
    case "commandExecution": {
      const meta = [item.exitCode != null && item.exitCode !== 0 ? `exit ${item.exitCode}` : "", fmtDuration(item.durationMs), item.status === "declined" ? "declined" : ""].filter(Boolean).join(" · ");
      const det = el("details", { class: "tool", open: entry.open },
        el("summary", {}, statusDot(item.status), el("span", { class: "what", title: item.command }, "$ " + item.command), el("span", { class: "meta" }, meta)),
        item.cwd ? el("div", { class: "notice" }, "in " + shortPath(item.cwd)) : null,
        el("div", { class: "output" }, item.aggregatedOutput || (item.status === "inProgress" ? "…" : "(no output)")));
      node.append(det); break;
    }
    case "fileChange": {

      const names = changes.map((c) => shortPath(c.path)).join(", ");
      const det = el("details", { class: "tool", open: entry.open || item.status === "inProgress" },
        el("summary", {}, statusDot(item.status), el("span", { class: "what" }, `Edit ${changes.length} file${changes.length === 1 ? "" : "s"}: ${names}`), el("span", { class: "meta" }, item.status === "declined" ? "declined" : "")),
        changes.map((c) => [el("div", { class: "notice" }, `${c.kind && c.kind.type === "add" ? "add" : c.kind && c.kind.type === "delete" ? "delete" : "update"} ${c.path}${c.kind && c.kind.move_path ? " → " + c.kind.move_path : ""}`), renderDiff(c.diff)]));
      node.append(det); break;

    case "mcpToolCall": {

        el("summary", {}, statusDot(item.status), el("span", { class: "what" }, `${item.server}.${item.tool}`), el("span", { class: "meta" }, fmtDuration(item.durationMs))),
        el("div", { class: "output" }, JSON.stringify(item.arguments, null, 2)),

        item.result ? el("div", { class: "output" }, JSON.stringify(item.result.content ?? item.result, null, 2)) : null);
      node.append(det); break;

    case "dynamicToolCall": {
      node.append(el("div", { class: "notice" }, `Tool ${item.namespace ? item.namespace + "." : ""}${item.tool} (${item.status})`)); break;
    }

    case "imageView": node.append(el("div", { class: "notice" }, "Viewed image " + shortPath(item.path || ""))); break;
    case "contextCompaction": node.append(el("div", { class: "notice" }, "Context compacted")); break;
    case "enteredReviewMode": node.append(el("div", { class: "notice" }, "Review started")); break;
    case "exitedReviewMode": { const div = el("div", { class: "agent" }); div.innerHTML = renderMarkdown(item.review || ""); node.append(div); break; }
    case "collabAgentToolCall": node.append(el("div", { class: "notice" }, `Sub-agent ${item.tool} (${item.status})`)); break;
    case "subAgentActivity": node.append(el("div", { class: "notice" }, `Sub-agent ${item.agentPath || ""}: ${item.kind || ""}`)); break;

}

function appendToItem(itemId, mutate) {
  const entry = S.items.get(itemId);
  if (!entry) return;
  mutate(entry.item);
  if (!entry.pending) {
    entry.pending = true;
    requestAnimationFrame(() => {
      entry.pending = false;
      const det = entry.node.querySelector("details"); entry.open = det ? det.open : entry.open;
      drawItem(entry); scrollToBottom();
    });
  }
}

function renderPlan(turnId, explanation, plan) {
  let node = S.plans.get(turnId);
  if (!node) { node = el("div", { class: "item plan" }); S.plans.set(turnId, node); $("items").append(node); }
  node.textContent = "";
  node.append(el("div", { class: "notice" }, explanation || "Plan"));
  for (const step of plan || []) node.append(el("div", { class: "step " + step.status }, (step.status === "completed" ? "✓ " : step.status === "inProgress" ? "→ " : "○ ") + step.step));
  scrollToBottom();
}

// ---------- notifications ----------
function onNotification(method, p) {
  // The cost total covers every session in this window's app-server, so track it for all threads.
  if (method === "thread/tokenUsage/updated" && p.providerCostMicros != null) S.costMicros = Math.max(S.costMicros || 0, p.providerCostMicros);
  if (p.threadId && p.threadId !== S.threadId) {
    if (method === "turn/completed" || method === "thread/name/updated") refreshSessions();
    return;
  }
  switch (method) {
    case "turn/started": S.turnId = p.turn.id; setRunning(true); break;
    case "turn/completed":
      if (p.turn.status === "failed" && p.turn.error) notice(p.turn.error.message + (p.turn.error.additionalDetails ? "\n" + p.turn.error.additionalDetails : ""), "error");
      if (p.turn.status === "interrupted") notice("Turn stopped.");
      S.turnId = null; setRunning(false); refreshSessions(); break;
    case "item/started": case "item/completed": renderItem(p.item, p.turnId); break;
    case "item/agentMessage/delta": appendToItem(p.itemId, (it) => { it.text = (it.text || "") + p.delta; }); break;
    case "item/plan/delta": appendToItem(p.itemId, (it) => { it.text = (it.text || "") + p.delta; }); break;
    case "item/reasoning/summaryTextDelta":
      appendToItem(p.itemId, (it) => { it.summary = [...(it.summary || [])]; while (it.summary.length <= p.summaryIndex) it.summary.push(""); it.summary[p.summaryIndex] += p.delta; }); break;
    case "item/commandExecution/outputDelta": appendToItem(p.itemId, (it) => { it.aggregatedOutput = (it.aggregatedOutput || "") + p.delta; }); break;
    case "item/fileChange/patchUpdated": appendToItem(p.itemId, (it) => { it.changes = p.changes; }); break;
    case "turn/plan/updated": renderPlan(p.turnId, p.explanation, p.plan); break;
    case "error": notice((p.willRetry ? "Retrying: " : "Error: ") + (p.error && p.error.message), p.willRetry ? "warn" : "error"); break;
    case "warning": case "guardianWarning": notice(p.message || JSON.stringify(p), "warn"); break;
    case "configWarning": notice("Config: " + (p.summary || "") + (p.details ? "\n" + p.details : ""), "warn"); break;
    case "thread/status/changed":
      if (p.status && p.status.type === "active") setRunning(true);
      else if (p.status && p.status.type === "idle" && S.running && !S.turnId) setRunning(false);
      break;
    case "thread/name/updated": if (p.threadName || p.name) $("session-title").textContent = p.threadName || p.name; refreshSessions(); break;
    case "thread/started": break;
    case "serverRequest/resolved": dropApproval(p.requestId); break;
    case "thread/closed": if (p.threadId === S.threadId) { notice("This session was closed by the server."); S.threadId = null; setRunning(false); } break;
    case "thread/tokenUsage/updated": {
      const u = p.tokenUsage; S.usage = u; const total = u && u.total;
      if (total && total.totalTokens != null && !S.running) setStatus(`${total.totalTokens.toLocaleString()} tokens used`);
      break;
    }
  }
}

// ---------- server requests: approvals and questions ----------
function onRequest(req) {
  const supported = ["item/commandExecution/requestApproval", "item/fileChange/requestApproval", "item/permissions/requestApproval", "item/tool/requestUserInput", "mcpServer/elicitation/request"];
  if (!supported.includes(req.method)) { S.rpc.respondError(req.id, `${req.method} is not supported by the GUI`); return; }
  S.approvals.push(req);
  showNextApproval();
}
function dropApproval(requestId) {
  S.approvals = S.approvals.filter((r) => r.id !== requestId);
  if (S.approvalOpen && S.approvalOpen.req.id === requestId) { S.approvalOpen.close(); S.approvalOpen = null; showNextApproval(); }
}
function answer(req, result) {
  S.rpc.respond(req.id, result);
  S.approvals = S.approvals.filter((r) => r !== req);
  if (S.approvalOpen) { S.approvalOpen.close(); S.approvalOpen = null; }
  showNextApproval();
}
function showNextApproval() {
  if (S.approvalOpen || !S.approvals.length) return;
  const req = S.approvals[0], p = req.params || {};
  let title, body = [], actions = [];
  const decide = (decision) => answer(req, { decision });
  if (req.method === "item/commandExecution/requestApproval") {
    title = p.networkApprovalContext ? "Allow network access?" : "Run this command?";
    body.push(p.command ? el("pre", { class: "cmd" }, p.command) : null,
      p.cwd ? el("div", { class: "muted" }, "in " + p.cwd) : null,
      p.reason ? el("p", {}, p.reason) : null,
      p.networkApprovalContext ? el("pre", { class: "cmd" }, JSON.stringify(p.networkApprovalContext, null, 2)) : null);
    actions = [["Run", "primary", () => decide("accept")], ["Allow for this session", "", () => decide("acceptForSession")], ["Decline", "", () => decide("decline")], ["Decline and stop", "danger", () => decide("cancel")]];
  } else if (req.method === "item/fileChange/requestApproval") {
    title = "Apply these changes?";
    const entry = S.items.get(p.itemId);
    body.push(p.reason ? el("p", {}, p.reason) : null, p.grantRoot ? el("p", { class: "muted" }, "Also asks to allow writes under " + p.grantRoot + " for this session.") : null);
    for (const c of (entry && entry.item.changes) || []) body.push(el("div", { class: "muted" }, c.path), renderDiff(c.diff));
    actions = [["Apply", "primary", () => decide("accept")], ["Allow for this session", "", () => decide("acceptForSession")], ["Decline", "", () => decide("decline")], ["Decline and stop", "danger", () => decide("cancel")]];
  } else if (req.method === "item/permissions/requestApproval") {
    title = "Grant additional permissions?";
    body.push(p.reason ? el("p", {}, p.reason) : null, el("pre", { class: "cmd" }, JSON.stringify(p.permissions, null, 2)));
    const grant = (scope) => answer(req, { permissions: { ...(p.permissions.network ? { network: p.permissions.network } : {}), ...(p.permissions.fileSystem ? { fileSystem: p.permissions.fileSystem } : {}) }, scope });
    actions = [["Grant for this turn", "primary", () => grant("turn")], ["Grant for this session", "", () => grant("session")], ["Deny", "", () => answer(req, { permissions: {}, scope: "turn" })]];
  } else if (req.method === "item/tool/requestUserInput") {
    title = "Codex has a question";
    const fields = [];
    for (const q of p.questions || []) {
      body.push(el("p", {}, el("strong", {}, q.header ? q.header + ": " : ""), q.question));
      if (q.options && q.options.length) {
        const sel = el("select", {}, q.options.map((o) => el("option", { value: o.label, title: o.description }, o.label + (o.description ? " – " + o.description : ""))));
        body.push(sel); fields.push([q.id, () => sel.value]);
      } else {
        const inp = el("input", { type: q.isSecret ? "password" : "text", style: "width:100%" });
        body.push(inp); fields.push([q.id, () => inp.value]);
      }
    }
    actions = [["Answer", "primary", () => answer(req, { answers: Object.fromEntries(fields.map(([id, get]) => [id, { answers: [get()] }])) })],
      ["Skip", "", () => answer(req, { answers: {} })]];
  } else if (req.method === "mcpServer/elicitation/request") {
    title = "An MCP server asks for input";
    body.push(el("pre", { class: "cmd" }, JSON.stringify(p, null, 2)), el("p", { class: "muted" }, "Answering MCP forms is not supported in the GUI yet."));
    actions = [["Decline", "primary", () => answer(req, { action: "decline", content: null, _meta: null })], ["Cancel", "", () => answer(req, { action: "cancel", content: null, _meta: null })]];
  }
  const m = modal(title, body, actions, { dismissable: false });
  S.approvalOpen = { req, close: m.close };
}

// ---------- modals ----------
function modal(title, body, actions, opts) {
  const back = el("div", { class: "modal-back" });
  const close = () => back.remove();
  const box = el("div", { class: "modal", role: "dialog" },
    el("h2", {}, title),
    el("div", { class: "body" }, body),
    el("div", { class: "actions" }, actions.map(([label, cls, fn]) => el("button", { class: cls, onclick: () => { if (fn() !== false && !(opts && opts.keepOpen)) close(); } }, label))));
  back.append(box);
  if (!opts || opts.dismissable !== false) back.addEventListener("click", (e) => { if (e.target === back) { close(); opts && opts.onDismiss && opts.onDismiss(); } });
  document.body.append(back);
  const primary = box.querySelector("button.primary"); if (primary) primary.focus();
  return { close, box };
}
function alertModal(title, text) { modal(title, [el("p", { style: "white-space:pre-wrap" }, text)], [["OK", "primary", () => {}]]); }
function confirmModal(title, text) {
  return new Promise((resolve) => {
    modal(title, [el("p", {}, text)], [["Cancel", "", () => resolve(false)], ["Continue", "primary", () => resolve(true)]], { onDismiss: () => resolve(false) });
  });
}
function trustPrompt(trust) {
  return new Promise((resolve) => {
    const inRepo = trust.trustTarget !== trust.cwd;
    const done = (v) => { m.close(); resolve(v); };
    const m = modal("Trust this folder?", [
      el("p", {}, "Codex can read, edit, and run files in ", el("code", {}, trust.cwd), ", subject to your sandbox and approval settings. Project configuration and hooks can run even without a model request. Continue only if you trust these files."),
      inRepo ? el("p", { class: "muted" }, "This is inside a Git repository; trusting applies to the repository root: ", el("code", {}, trust.trustTarget)) : null,
      el("button", { class: "choice primary", onclick: () => done("trust") }, "Trust and continue", el("span", { class: "sub", style: "color:inherit;opacity:.85" }, "Your decision is saved, as in the TUI.")),
      el("button", { class: "choice", onclick: () => done("look") }, "Look without trusting", el("span", { class: "sub" }, "This session only: AGENTS.md, project skills, config, and hooks are ignored.")),
      el("button", { class: "choice", onclick: () => done("cancel") }, "Cancel"),
    ], [], { dismissable: true, onDismiss: () => resolve("cancel") });
    m.box.querySelector(".actions").remove();
  });
}
function folderPicker() {
  let current = S.cwd || S.home || "/";
  let showHidden = false;
  const pathInput = el("input", { type: "text", style: "flex:1;font-family:var(--mono);font-size:12.5px" });
  const list = el("div", { class: "dirlist" });
  const hidden = el("input", { type: "checkbox" });
  async function load(dir) {
    list.textContent = "";
    let entries;
    try { entries = (await S.rpc.request("fs/readDirectory", { path: dir })).entries; }
    catch (e) { list.append(el("div", { class: "empty" }, e.message)); return; }
    current = dir; pathInput.value = dir;
    if (dir !== "/") list.append(el("div", { onclick: () => load(parentPath(dir)) }, "⬑ .."));
    entries.filter((e) => e.isDirectory && (showHidden || !e.fileName.startsWith(".")))
      .sort((a, b) => a.fileName.localeCompare(b.fileName))
      .forEach((e) => list.append(el("div", { onclick: () => load(joinPath(dir, e.fileName)), ondblclick: () => choose(joinPath(dir, e.fileName)) }, "📁 " + e.fileName)));
  }
  hidden.addEventListener("change", () => { showHidden = hidden.checked; load(current); });
  pathInput.addEventListener("keydown", (e) => { if (e.key === "Enter") load(pathInput.value.trim() || "/"); });
  let m;
  async function choose(dir) { m.close(); await openFolder(dir); }
  m = modal("Open folder", [
    el("div", { style: "display:flex;gap:6px" }, pathInput, el("button", { onclick: () => load(S.home || "/") }, "Home")),
    list,
    el("label", { class: "muted", style: "display:block;margin-top:6px" }, hidden, " show hidden folders"),
  ], [["Cancel", "", () => {}], ["Open this folder", "primary", () => { choose(current); return false; }]]);
  load(current);
}

// ---------- slash commands ----------
const COMMANDS = [
  { name: "new", desc: "start a new session", run: () => cmdNew() },
  { name: "clear", desc: "clear the view and start a new session", run: () => cmdNew() },
  { name: "status", desc: "show session configuration, token usage and cost", run: () => cmdStatus() },
  { name: "model", desc: "choose the model", run: () => { const m = $("model"); m.focus(); try { m.showPicker(); } catch (e) { /* not supported */ } } },
  { name: "stop", desc: "stop the running turn", run: () => (S.running ? stop() : notice("Nothing is running.")) },
  { name: "rename", args: "<name>", desc: "rename the current session", run: (a) => cmdRename(a) },
  { name: "compact", idle: true, desc: "summarize the conversation to free up context", run: () => cmdCompact() },
  { name: "review", args: "[instructions]", idle: true, desc: "review uncommitted changes, or what you describe", run: (a) => cmdReview(a) },
  { name: "init", idle: true, desc: "create an AGENTS.md file with instructions for Codex", run: () => sendText(S.info.initPrompt) },
  { name: "diff", desc: "show git diff (including untracked files)", run: () => cmdDiff() },
  { name: "fork", idle: true, desc: "continue the current session as a new copy", run: () => cmdFork() },
  { name: "archive", idle: true, desc: "archive the current session", run: () => cmdArchive() },
  { name: "delete", idle: true, desc: "permanently delete the current session", run: () => cmdDelete() },
  { name: "mcp", desc: "list MCP servers and their tools", run: () => cmdMcp() },
  { name: "skills", desc: "list available skills", run: () => cmdSkills() },
  { name: "pwd", desc: "show the current folder", run: () => notice("Folder: " + S.cwd) },
  { name: "help", desc: "list the commands", run: () => cmdHelp() },
];

let slashSel = 0;
function slashMatches() {
  const m = $("input").value.match(/^\/(\S*)$/);
  return m ? COMMANDS.filter((c) => c.name.startsWith(m[1].toLowerCase())) : null;
}
function updateSlash() {
  const box = $("slash"), list = slashMatches();
  if (!list || !list.length) { hideSlash(); return; }
  slashSel = Math.min(slashSel, list.length - 1);
  box.textContent = "";
  list.forEach((c, i) => box.append(el("div", { class: "cmd" + (i === slashSel ? " sel" : ""), onmousedown: (e) => { e.preventDefault(); pickSlash(c); } },
    el("span", { class: "name" }, "/" + c.name + (c.args ? " " + c.args : "")), el("span", { class: "desc" }, c.desc))));
  box.hidden = false;
  const sel = box.querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
}
function hideSlash() { $("slash").hidden = true; slashSel = 0; }
function pickSlash(c) {
  const input = $("input");
  hideSlash();
  // A required argument (<...>) is typed next; optional ones ([...]) may be left out.
  if (c.args && c.args.startsWith("<")) { input.value = "/" + c.name + " "; input.focus(); }
  else { input.value = "/" + c.name; send(); }
}

async function runSlash(text) {
  const [, name, arg] = text.match(/^\/(\S+)\s*([\s\S]*)$/);
  const cmd = COMMANDS.find((c) => c.name === name.toLowerCase());
  if (!cmd) { notice(`Unknown command /${name}. Type /help for the list; start with // to send a message that begins with a slash.`, "warn"); return; }
  if (cmd.idle && S.running) { notice(`/${cmd.name} is not available while a turn is running. Wait for it or use /stop.`, "warn"); return; }
  try { await cmd.run(arg.trim()); }
  catch (e) { notice(`/${cmd.name} failed: ${e.message}`, "error"); }
}
function needThread() {
  if (S.threadId) return true;
  notice("No session yet: send a message or pick a saved session first.", "warn");
  return false;
}
const fmtNum = (n) => (n == null ? "?" : Number(n).toLocaleString());
function formatEur(micros) { const e = micros / 1e6; return "€" + (e >= 1 ? e.toFixed(2) : e.toFixed(4)); }
function kvTable(rows) {
  return el("table", { class: "kv" }, rows.filter(Boolean).map(([k, v]) => el("tr", {}, el("td", {}, k), el("td", {}, v))));
}

async function cmdNew() {
  if (S.running && !(await confirmModal("A turn is still running", "Start a new session anyway? The running turn continues in the background until this window closes."))) return;
  await leaveThread(); newSession(); refreshSessions();
}

async function cmdStatus() {
  const ti = S.threadInfo, u = S.usage;
  let account = "unknown";
  try {
    const a = await S.rpc.request("account/read", {});
    account = !a.account ? (a.requiresOpenaiAuth ? "not logged in" : "none required")
      : a.account.type === "apiKey" ? "API key"
      : a.account.type === "chatgpt" ? `ChatGPT ${a.account.email || ""}`.trim() : a.account.type;
  } catch (e) { /* older server */ }
  let permissions = "from config (no session yet)";
  if (ti) {
    permissions = describeSandbox(ti.sandbox, ti.approvalPolicy)[0].replace(/^sandbox: /, "");
    if (ti.sandbox && ti.sandbox.writableRoots && ti.sandbox.writableRoots.length) permissions += " · also writable: " + ti.sandbox.writableRoots.map(shortPath).join(", ");
  }
  let context = null;
  if (u && u.modelContextWindow) {
    const BASELINE = 12000, win = u.modelContextWindow, used = u.last.totalTokens;
    const left = win <= BASELINE ? 0 : Math.round(Math.min(100, Math.max(0, (win - BASELINE - Math.max(0, used - BASELINE)) / (win - BASELINE) * 100)));
    context = ["Context window", `${left}% left (${fmtNum(used)} used / ${fmtNum(win)})`];
  }
  const sources = ti && ti.instructionSources && ti.instructionSources.length ? ti.instructionSources.map(shortPath).join(", ") : (ti ? "none" : "—");
  modal("Status", [kvTable([
    ["Model", ti ? `${ti.model}${ti.reasoningEffort ? ` (reasoning ${ti.reasoningEffort})` : ""}` : (S.modelOverride || "from config (no session yet)")],
    ti ? ["Model provider", ti.modelProvider] : null,
    ["Directory", el("code", {}, S.cwd || "")],
    ["Folder trust", $("trust-badge").textContent],
    ["Permissions", permissions],
    ["Agents.md", sources],
    ["Account", account],
    ["Session", S.threadId ? el("code", {}, S.threadId) : "not started"],
    S.thread && S.thread.name ? ["Thread name", S.thread.name] : null,
    ["Token usage", u ? `${fmtNum(u.total.totalTokens)} total (${fmtNum(u.total.inputTokens)} input, ${fmtNum(u.total.cachedInputTokens)} cached, ${fmtNum(u.total.outputTokens)} output)` : "none yet"],
    context,
    ["Cost", S.costMicros != null ? `${formatEur(S.costMicros)} since this window was opened (all its sessions, as reported by the provider)` : "not reported by the provider yet"],
  ])], [["Close", "primary", () => {}]]);
}

function promptModal(title, value) {
  return new Promise((resolve) => {
    const input = el("input", { type: "text", style: "width:100%" }); input.value = value || "";
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    const m = modal(title, [input], [["Cancel", "", () => finish(null)], ["OK", "primary", () => finish(input.value.trim() || null)]], { onDismiss: () => finish(null) });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); m.close(); finish(input.value.trim() || null); } });
    input.focus(); input.select();
  });
}
async function cmdRename(arg) {
  if (!needThread()) return;
  const name = arg || (await promptModal("Rename session", $("session-title").textContent));
  if (!name) return;
  await S.rpc.request("thread/name/set", { threadId: S.threadId, name });
  $("session-title").textContent = name;
  if (S.thread) S.thread.name = name;
  refreshSessions();
}
async function cmdCompact() {
  if (!needThread()) return;
  await S.rpc.request("thread/compact/start", { threadId: S.threadId });
  notice("Compacting the conversation…");
}
async function cmdReview(arg) {
  await ensureThread();
  const target = arg ? { type: "custom", instructions: arg } : { type: "uncommittedChanges" };
  setRunning(true);
  try {
    const r = await S.rpc.request("review/start", { threadId: S.threadId, target, delivery: "inline" });
    if (r && r.turn) S.turnId = r.turn.id;
  } catch (e) { setRunning(false); throw e; }
}
async function cmdDiff() {
  const run = (command) => S.rpc.request("command/exec", { command, cwd: S.cwd, timeoutMs: 20000, sandboxPolicy: { type: "readOnly", networkAccess: false } });
  const inside = await run(["git", "rev-parse", "--is-inside-work-tree"]);
  if (inside.exitCode !== 0) { alertModal("/diff", "This folder is not inside a Git repository."); return; }
  let tracked = await run(["git", "-c", "core.quotepath=off", "diff", "--no-color", "HEAD"]);
  if (tracked.exitCode !== 0) tracked = await run(["git", "-c", "core.quotepath=off", "diff", "--no-color", "--cached"]); // no commits yet
  let text = tracked.stdout;
  const untracked = (await run(["git", "ls-files", "--others", "--exclude-standard", "-z"])).stdout.split("\0").filter(Boolean);
  for (const file of untracked.slice(0, 50)) text += (await run(["git", "diff", "--no-color", "--no-index", "--", "/dev/null", file])).stdout;
  if (untracked.length > 50) text += `\n… and ${untracked.length - 50} more untracked files\n`;
  const m = modal("Changes in " + shortPath(S.cwd), [text.trim() ? renderDiff(text) : el("p", {}, "No changes.")], [["Close", "primary", () => {}]]);
  m.box.classList.add("wide");
}
async function cmdFork() {
  if (!needThread()) return;
  const old = S.threadId;
  const r = await S.rpc.request("thread/fork", { threadId: old, ...threadOverrides() });
  S.threadId = null;
  try { await S.rpc.request("thread/unsubscribe", { threadId: old }); } catch (e) { /* already gone */ }
  clearTranscript();
  showThread(r);
  notice("Forked: this is a new copy of the session; the original stays as it was.");
  refreshSessions(); scrollToBottom(true);
}
async function cmdArchive() {
  if (!needThread()) return;
  const id = S.threadId;
  await S.rpc.request("thread/archive", { threadId: id });
  S.threadId = null; newSession(); refreshSessions();
  notice(`Session archived. Restore it with: cortecs-codex unarchive ${id}`);
}
async function cmdDelete() {
  if (!needThread()) return;
  const id = S.threadId;
  if (!(await confirmModal("Delete this session?", "The session and its history are removed permanently. This cannot be undone."))) return;
  await S.rpc.request("thread/delete", { threadId: id });
  S.threadId = null; newSession(); refreshSessions();
  notice("Session deleted.");
}
async function cmdMcp() {
  const r = await S.rpc.request("mcpServerStatus/list", { threadId: S.threadId || null });
  const body = r.data.length ? r.data.map((srv) => {
    const tools = Object.keys(srv.tools || {}).sort();
    const status = srv.runtimeStatus ? (typeof srv.runtimeStatus === "string" ? srv.runtimeStatus : JSON.stringify(srv.runtimeStatus)) : "";
    return el("div", { style: "margin:.6em 0" }, el("strong", {}, srv.name), " ", el("span", { class: "muted" }, [status, srv.authStatus].filter(Boolean).join(" · ")),
      el("div", { class: "muted" }, tools.length ? "Tools: " + tools.join(", ") : srv.toolsError || "No tools"));
  }) : [el("p", {}, "No MCP servers are configured. Add them in config.toml or with `cortecs-codex mcp add`.")];
  modal("MCP servers", body, [["Close", "primary", () => {}]]);
}
async function cmdSkills() {
  const r = await S.rpc.request("skills/list", { cwds: [S.cwd] });
  const skills = r.data.flatMap((entry) => entry.skills);
  const errors = r.data.flatMap((entry) => entry.errors || []);
  const body = skills.length ? [kvTable(skills.map((sk) => ["$" + sk.name, `${sk.shortDescription || sk.description}${sk.enabled ? "" : " (disabled)"} — ${sk.scope}`]))] : [el("p", {}, "No skills found.")];
  for (const e of errors) body.push(el("p", { class: "notice error" }, e.message || JSON.stringify(e)));
  modal("Skills", body, [["Close", "primary", () => {}]]);
}
function cmdHelp() {
  modal("Commands", [kvTable(COMMANDS.map((c) => [el("code", {}, "/" + c.name + (c.args ? " " + c.args : "")), c.desc])),
    el("p", { class: "muted" }, "Start a message with // to send it with a leading slash.")], [["Close", "primary", () => {}]]);
}

// ---------- composer ----------
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, window.innerHeight * 0.4) + "px"; }
$("input").addEventListener("input", () => { autosize(); updateSlash(); });
$("input").addEventListener("blur", () => setTimeout(hideSlash, 150));
$("input").addEventListener("keydown", (e) => {
  const list = !$("slash").hidden && slashMatches();
  if (list && list.length) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      slashSel = (slashSel + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
      updateSlash(); return;
    }
    if (e.key === "Tab") { e.preventDefault(); $("input").value = "/" + list[slashSel].name + " "; hideSlash(); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); pickSlash(list[slashSel]); return; }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hideSlash(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.running && !document.querySelector(".modal-back")) stop(); });
$("send").addEventListener("click", send);
$("model").addEventListener("change", () => { S.modelOverride = $("model").value || null; });
$("stop").addEventListener("click", stop);
$("change-folder").addEventListener("click", folderPicker);
$("new-session").addEventListener("click", cmdNew);

// ---------- startup ----------
async function main() {
  let info;
  try { info = await api("/api/info"); }
  catch (e) { showBanner("Cannot reach the Codex GUI bridge. Start it again with `cortecs-codex gui` and open the URL it prints."); return; }
  S.home = info.home; S.info = info;
  const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`;
  S.rpc = new Rpc(wsUrl);
  S.rpc.onNotification = onNotification;
  S.rpc.onRequest = onRequest;
  S.rpc.onClose = () => { setRunning(false); showBanner("Disconnected from Codex. Reload the page to reconnect (if the terminal running `cortecs-codex gui` is still open)."); };
  try {
    await S.rpc.ready;
    await S.rpc.request("initialize", {
      clientInfo: { name: "codex_gui", title: "Codex GUI", version: info.version },
      capabilities: { experimentalApi: true, requestAttestation: false },
    });
    S.rpc.notify("initialized");
  } catch (e) { showBanner("Could not start Codex: " + e.message); return; }
  await loadModels();
  if (!(await openFolder(info.cwd))) {
    $("folder-path").textContent = "(no folder open)";
    folderPicker();
  }
}
main();
</script>
